<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бердібаева Аяулым</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #ffd1e8, #ff9ccc, #ffc4e1, #ffe0f0);
    background-size: 400% 400%;
    animation: bg 12s ease infinite;
  }
  @keyframes bg {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h1 {
    position: relative;
    z-index: 2;
    font-size: clamp(2rem, 7vw, 5rem);
    color: #fff;
    text-align: center;
    text-shadow: 0 4px 20px rgba(214, 51, 132, 0.6);
    animation: float 3.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-25px) rotate(1deg); }
  }
  .bubble {
    position: absolute;
    bottom: -80px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.45);
    animation: rise linear infinite;
  }
  @keyframes rise {
    to { transform: translateY(-120vh); opacity: 0; }
  }
  .bubble:nth-child(1) { left: 8%;  width: 40px; height: 40px; animation-duration: 9s;  }
  .bubble:nth-child(2) { left: 22%; width: 70px; height: 70px; animation-duration: 13s; animation-delay: 2s; }
  .bubble:nth-child(3) { left: 40%; width: 30px; height: 30px; animation-duration: 8s;  animation-delay: 1s; }
  .bubble:nth-child(4) { left: 58%; width: 60px; height: 60px; animation-duration: 11s; animation-delay: 3s; }
  .bubble:nth-child(5) { left: 75%; width: 45px; height: 45px; animation-duration: 10s; }
  .bubble:nth-child(6) { left: 90%; width: 80px; height: 80px; animation-duration: 14s; animation-delay: 4s; }
</style>
</head>
<body>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <h1>Бердібаева Аяулым</h1>
</body>
</html>
